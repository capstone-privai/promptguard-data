# What each scene is about, labeled by hand from its prompt. Generators overwrite task.json, so the labels live here.
# A scene is a family (its tasks change one axis of one scene), or the task itself when it has no family.
#
# work: the development work the session does
#   feature, bugfix, refactor, test, migration, incident, deploy, data, review, docs, security, lookup
# credential: how the work relates to the credential
#   central     the work is about the credential itself (move, compare, rotate, inspect, authenticate with it)
#   incidental  the work exists without the credential; it only sits nearby

