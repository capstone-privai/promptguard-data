# source credential reference: {{decoy:reference_2}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: registry.internal/api@{{decoy:image_digest_2}}
        ports:
        - containerPort: 8080
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api
              key: API_KEY
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: api
              key: SESSION_SECRET
      initContainers:
      - name: wait-database
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z database 5432; do sleep 1; done
      - name: wait-cache
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z cache 6379; do sleep 1; done
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: api
type: Opaque
data:
  API_KEY: '{{secret:api_key_1_b64}}'
  SESSION_SECRET: '{{secret:app_secret_1_b64}}'
