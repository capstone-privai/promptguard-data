<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptGuard 평가</title>
  <meta name="description" content="PromptGuard main 브랜치의 탐지 성능, 탐지 지연, 작업 성공 평가 결과">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">PromptGuard <span class="sub">평가</span></div>
      <button class="chip" id="commit-chip" type="button" aria-haspopup="dialog" aria-expanded="false">
        <span class="dot busy"></span><span class="soft">불러오는 중</span>
      </button>
    </header>

    <main id="app">
      <section class="hero">
        <div class="card" id="hero">
          <div class="eyebrow">탐지 성능 <span class="tag-mono">metric-detection</span></div>
          <div class="kpis" id="kpis"></div>
          <div id="kpi-more"></div>
          <div id="hero-note"></div>
        </div>
        <div class="card" id="trend">
          <div class="card-head">
            <h2>커밋별 변화</h2>
            <div class="tools">
              <div class="select"><select id="trend-dataset" aria-label="추이를 볼 데이터셋"></select></div>
              <button class="ghost" id="trend-table-toggle" type="button" aria-pressed="false">표</button>
            </div>
          </div>
          <div id="trend-body"></div>
        </div>
      </section>

      <section class="card" id="details">
        <div class="card-head">
          <h2>세부 사항</h2>
          <button class="link" id="reset" type="button" hidden>필터 초기화</button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="slice" id="slice"></div>
        <div id="breakdown"></div>
        <div class="outcomes" id="outcomes"></div>
      </section>

      <section class="card" id="latency">
        <div class="card-head">
          <h2>탐지 지연 <span class="tag-mono">metric-latency</span></h2>
          <div class="tools" id="latency-tools"></div>
        </div>
        <div id="latency-body"></div>
      </section>

      <section class="card" id="task" hidden>
        <div class="card-head">
          <h2>작업 성공 <span class="tag-mono">metric-task</span></h2>
          <div class="tools" id="task-tools"></div>
        </div>
        <div id="task-body"></div>
      </section>
    </main>
  </div>
</body>
</html>
