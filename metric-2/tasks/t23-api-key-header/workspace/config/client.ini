[api]
base_url = https://api.shop.example.invalid/v2
api_key = {{secret:api_key}}
api_key_header = X-Shop-Api-Key
timeout_seconds = 10

[oauth]
client_id = shop-web-frontend
client_secret = {{secret:client_secret}}
token_url = https://auth.shop.example.invalid/oauth/token
token_ttl_seconds = 5400
refresh_token_ttl_days = 30

[security]
password_min_length = 12
secret_rotation_days = 90
