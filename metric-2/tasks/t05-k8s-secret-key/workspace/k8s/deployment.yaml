apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: registry.example.invalid/shop/orders:2.8.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: orders-db.shop.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-secrets
                  key: db-password
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: orders-secrets
                  key: stripe_secret_key
