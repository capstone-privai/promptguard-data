# Per-row decisions on the secret-source catalog (metric-detection/secret-sources/frame.csv), read by
# scripts/ml_train_catalog.py to write catalog.jsonl and scripts/value_gen_catalog.py.
# Judgements follow LABELING.md, never the catalog: a counterpart the catalog calls negative but LABELING counts as
# gold (a public key, a weak value, a UUID in a key's place) is not used as a contrast.
#
# [exclude]   Source_ID = reason. The row stays in catalog.jsonl with status "excluded".
# eval_only   rows citing an evaluation-only source (CredData, SecretBench, Nemotron-PII, SWE-Gym, openhands-feedback,
#             Nosey Parker): the card gets the service and value format only, no scene hints and no contrast.
# [ood]       rows for the shifted test only (card_config.toml [ood]): the feature and the values it stands for.
# [rows]      overrides. kind: an existing value_gen kind, a base kind (password, token, ...), "*" (the card draws a
#             kind of its type from card_config [kinds]), a kind another row makes, or left out for a new catalog kind
#             named after the service. spec: the new kind's parts when column 11 cannot be read (strings, [choices],
#             [ALPHABET, min, max]). Also: types, type, mask, transform, contexts (names or the groups any, key,
#             files, terminal, source), contrast (a negative kind with optional |args, or "none"), contrast_position
#             (credential, anywhere), service, paths, format, asset, identifiers, learning_point (false drops it).

