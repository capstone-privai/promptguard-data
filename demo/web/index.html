<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptGuard 파이프라인</title>
  <meta name="description" content="Native Mod가 가로챈 입력이 탐지 모듈이 찾은 스팬의 합집합으로 가려진 채 모델로 가는 과정을 실시간으로 보여 준다">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='5' width='14' height='6' rx='2' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">PromptGuard <span class="sub">실시간 파이프라인</span></div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="show-quiet"> <span>그대로 통과 <b id="quiet-count">0</b>건 보기</span></label>
      <button class="ghost" id="clear" type="button">비우기</button>
      <span class="status" id="status"><span class="dot"></span><span id="status-text">연결 중</span></span>
    </div>
  </header>

  <div class="heads" aria-hidden="true">
    <div class="head"><span class="num">1</span>들어온 입력</div>
    <div class="head ensemble">
      <div class="step"><span class="num">2</span>탐지 모듈</div>
      <div class="step"><span class="num">3</span>모듈별 스팬 → 합집합 <span class="rule" id="rule"></span></div>
    </div>
    <div class="head"><span class="num">4</span>모델로 보내는 텍스트</div>
  </div>

  <main id="feed">
    <div class="empty" id="empty">
      <p>Mod가 탐지기를 부르면 여기에 나타납니다.</p>
      <p class="soft">Claude Code에서 프롬프트를 보내거나 파일을 읽게 해 보세요.</p>
    </div>
  </main>
</body>
</html>
